name: Sanitizers

on:
  push:
    branches: ["main"]
    paths:
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/sanitizers.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One matrix replaces six hand-maintained jobs.  Each (platform × sanitizer)
# combination runs the full test suite:
#   • ASan+UBSan — heap/stack overflows, use-after-free/return/scope, leaks,
#     signed-overflow, null deref, misaligned access, OOB indexing, bad enums.
#   • TSan       — data races, lock-order inversions, uninitialised mutexes.
# Platforms: x86_64 (SSE2/AVX), aarch64 native runner (NEON, no QEMU), and
# Apple Silicon (Darwin allocator + Apple sanitizer runtime).  A bug silent on
# one arch/OS can surface on another, so all three run for both sanitizers.
jobs:
  sanitize:
    name: ${{ matrix.san }} · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── AddressSanitizer + UndefinedBehaviorSanitizer ──────────────────
          - { san: asan-ubsan, label: "Clang 18 · x86_64",           os: ubuntu-latest,    install_clang: true,  cxx: clang++-18, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g", asan_opts: "halt_on_error=1:detect_leaks=1:abort_on_error=1", ubsan_opts: "halt_on_error=1:print_stacktrace=1:abort_on_error=1", tsan_opts: "" }
          - { san: asan-ubsan, label: "Clang 18 · aarch64",          os: ubuntu-24.04-arm, install_clang: true,  cxx: clang++-18, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g", asan_opts: "halt_on_error=1:detect_leaks=1:abort_on_error=1", ubsan_opts: "halt_on_error=1:print_stacktrace=1:abort_on_error=1", tsan_opts: "" }
          # macOS: LeakSanitizer is unsupported → detect_leaks omitted.
          - { san: asan-ubsan, label: "Apple Clang · Apple Silicon", os: macos-latest,     install_clang: false, cxx: clang++,    flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g", asan_opts: "halt_on_error=1:abort_on_error=1",                ubsan_opts: "halt_on_error=1:print_stacktrace=1:abort_on_error=1", tsan_opts: "" }
          # ── ThreadSanitizer (incompatible with ASan → separate jobs) ───────
          - { san: tsan, label: "Clang 18 · x86_64",           os: ubuntu-latest,    install_clang: true,  cxx: clang++-18, flags: "-fsanitize=thread -fno-omit-frame-pointer -g", asan_opts: "", ubsan_opts: "", tsan_opts: "halt_on_error=1:abort_on_error=1" }
          - { san: tsan, label: "Clang 18 · aarch64",          os: ubuntu-24.04-arm, install_clang: true,  cxx: clang++-18, flags: "-fsanitize=thread -fno-omit-frame-pointer -g", asan_opts: "", ubsan_opts: "", tsan_opts: "halt_on_error=1:abort_on_error=1" }
          - { san: tsan, label: "Apple Clang · Apple Silicon", os: macos-latest,     install_clang: false, cxx: clang++,    flags: "-fsanitize=thread -fno-omit-frame-pointer -g", asan_opts: "", ubsan_opts: "", tsan_opts: "halt_on_error=1:abort_on_error=1" }

    steps:
    - uses: actions/checkout@v7

    - name: Install Clang 18 (Linux)
      if: matrix.install_clang
      run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 18

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DQBUEM_JSON_BUILD_TESTS=ON
        -DQBUEM_JSON_BUILD_BENCHMARKS=OFF
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

    - name: Build
      run: cmake --build build -j3

    - name: Test
      working-directory: build
      env:
        ASAN_OPTIONS: ${{ matrix.asan_opts }}
        UBSAN_OPTIONS: ${{ matrix.ubsan_opts }}
        TSAN_OPTIONS: ${{ matrix.tsan_opts }}
      run: ctest --output-on-failure --timeout 300
